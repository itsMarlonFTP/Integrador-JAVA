services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: retaildb
      POSTGRES_USER: retail_dev
      POSTGRES_PASSWORD: retail_dev
    ports:
      - "5432:5432"
    volumes:
      - retail-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_dev -d retaildb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  retail-postgres-data:
