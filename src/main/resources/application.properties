# Configuración de la aplicación
spring.application.name=retail-order-service
 
# Configuración de la base de datos H2 (en memoria)
spring.datasource.url=jdbc:h2:mem:retaildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
 
# Habilitar consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
 
# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true