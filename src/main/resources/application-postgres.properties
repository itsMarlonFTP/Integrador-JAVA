spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/retaildb}
spring.datasource.username=${DB_USERNAME:retail_dev}
spring.datasource.password=${DB_PASSWORD:retail_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

